# Builds OpenHU with aasdk from the OpenHU fork and uploads the .deb.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  AASDK_REPO: https://github.com/average-web-dev/aasdk.git
  AASDK_BRANCH: openhu

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: aasdk sources
        run: git clone --depth 1 --branch "$AASDK_BRANCH" "$AASDK_REPO" "$RUNNER_TEMP/aasdk"

      - uses: docker/setup-buildx-action@v3

      - name: Build
        run: |
          docker buildx build --load -t openhu:build \
            --build-context aasdk="$RUNNER_TEMP/aasdk" .

      - name: Collect packages
        run: |
          mkdir -p packages
          docker run --rm -v "$PWD/packages:/packages" openhu:build bash -c 'cp /output/*.deb /packages/'
          ls -l packages

      - uses: actions/upload-artifact@v4
        with:
          name: openhu-amd64
          path: packages/*.deb
          retention-days: 30
