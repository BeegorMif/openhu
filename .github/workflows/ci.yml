# Builds OpenHU for amd64 and arm64 against the newest fitting aasdk release (OPENHU_AASDK_VERSION)
# with qmllint and the unit tests (Dockerfile), installs the packages in a clean Debian, starts the
# shell headless and uploads the packages. A tag v<version> (digits and dots, e.g. v2026.10.13) builds with
# that version and publishes the packages as a GitHub release.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  # Sent by the aasdk workflow openhu.yml after a release
  repository_dispatch:
    types: [aasdk-release]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # tag v2026.10.13: release version 2026.10.13, otherwise the build date
      - name: Version
        run: |
          version=""
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            case "$version" in
              ""|*[!0-9.]*|.*|*.|*..*) echo "::error::tag $GITHUB_REF_NAME: v followed by digits and dots (v2026.10.13)"; exit 1 ;;
            esac
          fi
          echo "OPENHU_VERSION=$version" >> "$GITHUB_ENV"

      - name: aasdk packages (release, else the aasdk CI)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(bash scripts/fetch-aasdk.sh "$RUNNER_TEMP/aasdk" ${{ matrix.arch }})
          echo "Building against aasdk $version:" >> "$GITHUB_STEP_SUMMARY"
          ls "$RUNNER_TEMP/aasdk" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          echo "aasdk $version"

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: packages
          build-contexts: aasdk=${{ runner.temp }}/aasdk
          build-args: OPENHU_VERSION=${{ env.OPENHU_VERSION }}
          outputs: type=local,dest=packages
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # Package name/architecture, then install in a clean Debian: every library of openhu must resolve,
      # and the shell starts headless and shows all pages without QML warnings (tests/shell-smoke.sh), plugin
      # pages survive changes of other plugins (tests/shell-plugin-pages.sh)
      - name: Smoke test
        run: |
          deb=$(ls packages/openhu_*_${{ matrix.arch }}.deb)
          [ "$(dpkg-deb -f "$deb" Architecture)" = "${{ matrix.arch }}" ]
          dpkg-deb -f "$deb" Package Version Architecture | paste -sd " " >> "$GITHUB_STEP_SUMMARY"
          docker run --rm -e DEBIAN_FRONTEND=noninteractive -v "$PWD/packages:/packages:ro" -v "$PWD/tests:/tests:ro" \
              debian:trixie-slim bash -euo pipefail -c '
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends /packages/libaasdk_*.deb /packages/openhu_*.deb python3-websockets >/dev/null
            dpkg -s openhu libaasdk | grep -E "^(Package|Status|Version):"
            ldd /usr/libexec/openhu/openhu
            if ldd /usr/libexec/openhu/openhu | grep "not found"; then exit 1; fi
            /tests/shell-smoke.sh /usr/bin/openhu
            /tests/shell-plugin-pages.sh /usr/bin/openhu'

      # openhu and the libaasdk packages it was built against
      - uses: actions/upload-artifact@v4
        with:
          name: openhu-${{ matrix.arch }}
          path: packages/*.deb
          retention-days: 30

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: openhu-*
          path: dist
          merge-multiple: true

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          ls dist
          # the package must carry the version of the tag
          for deb in dist/openhu_*.deb; do
            case "$(dpkg-deb -f "$deb" Version)" in
              "$version"-*) ;;
              *) echo "::error::$deb has version $(dpkg-deb -f "$deb" Version), expected $version"; exit 1 ;;
            esac
          done
          (cd dist && sha256sum *.deb > SHA256SUMS)
          scripts/release-notes.sh "$version" dist > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
          gh release create "$GITHUB_REF_NAME" dist/* --title "OpenHU $version" --notes-file notes.md
