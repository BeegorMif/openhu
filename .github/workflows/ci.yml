# Builds OpenHU against the newest fitting aasdk release (OPENHU_AASDK_VERSION) and uploads the .deb.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Sent by the aasdk workflow openhu.yml after a release
  repository_dispatch:
    types: [aasdk-release]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: aasdk release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(bash scripts/fetch-aasdk.sh "$RUNNER_TEMP/aasdk" amd64)
          echo "Building against aasdk $version:" >> "$GITHUB_STEP_SUMMARY"
          ls "$RUNNER_TEMP/aasdk" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          echo "aasdk $version"

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: packages
          build-contexts: aasdk=${{ runner.temp }}/aasdk
          outputs: type=local,dest=packages
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # openhu and the libaasdk packages it was built against
      - uses: actions/upload-artifact@v4
        with:
          name: openhu-amd64
          path: packages/*.deb
          retention-days: 30
